# =============================================================================
# Docker Compose for Construction Quantity Takeoff Engine
# =============================================================================
# Production-ready orchestration with:
# - PostgreSQL database
# - FastAPI backend
# - Streamlit frontend
# - Automatic database initialization
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f            # View logs
#   docker compose down               # Stop all services
#   docker compose down -v            # Stop and remove volumes
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  database:
    image: postgres:16-alpine
    container_name: metraj_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: construction_takeoff
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d construction_takeoff" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - metraj_network

  # ===========================================================================
  # FastAPI Backend
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metraj_backend
    restart: unless-stopped

    environment:
      # Application
      APP_ENV: production

      # Database
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: construction_takeoff
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-securepassword123}
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20

      # ODA Converter (installed in container)
      ODA_CONVERTER_PATH: /opt/ODAFileConverter/ODAFileConverter

    volumes:
      # Mount for file uploads (optional persistence)
      - upload_data:/app/uploads

    ports:
      - "8000:8000"

    depends_on:
      database:
        condition: service_healthy

    command: >
      sh -c "
        echo '🔧 Initializing database...' &&
        python database.py &&
        echo '🚀 Starting FastAPI...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000
      "

    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - metraj_network

  # ===========================================================================
  # Streamlit Frontend
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metraj_frontend
    restart: unless-stopped

    environment:
      # Backend API URL (internal Docker network)
      BACKEND_URL: http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy

    command: >
      streamlit run app.py 
        --server.port 8501 
        --server.address 0.0.0.0 
        --server.headless true
        --browser.gatherUsageStats false
        --theme.primaryColor "#667eea"
        --theme.backgroundColor "#0e1117"
        --theme.secondaryBackgroundColor "#1a1a2e"
        --theme.textColor "#ffffff"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - metraj_network

  # ===========================================================================
  # pgAdmin (Optional - Database Management UI)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: metraj_pgadmin
    restart: unless-stopped
    profiles:
      - admin # Only start with: docker-compose --profile admin up

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@metraj.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    ports:
      - "5050:80"

    depends_on:
      - database

    networks:
      - metraj_network

# =============================================================================
# Networks
# =============================================================================
networks:
  metraj_network:
    driver: bridge
    name: metraj_network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: metraj_postgres_data

  upload_data:
    name: metraj_upload_data

  pgadmin_data:
    name: metraj_pgadmin_data
